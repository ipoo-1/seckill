spring.application.name=seckill
server.port=8080

# 数据库连接配置。真实密码通过环境变量注入，不提交到 Git。
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/seckill?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway 管理表结构版本，应用启动时自动执行迁移。
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration

# Redis 配置
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.database=${REDIS_DATABASE:0}

# Elasticsearch 配置
spring.elasticsearch.uris=${ELASTICSEARCH_URIS:http://localhost:9200}

# RocketMQ 配置
rocketmq.name-server=${ROCKETMQ_NAME_SERVER:127.0.0.1:9876}
rocketmq.producer-group=${ROCKETMQ_PRODUCER_GROUP:seckill-producer-group}
rocketmq.consumer-group=${ROCKETMQ_CONSUMER_GROUP:seckill-consumer-group}
rocketmq.order-topic=${ROCKETMQ_ORDER_TOPIC:seckill-order}

# 秒杀参数
app.seckill.rate-limit-per-second=${SECKILL_RATE_LIMIT_PER_SECOND:2000}
app.seckill.reservation-ttl-seconds=${SECKILL_RESERVATION_TTL_SECONDS:604800}
app.seckill.stock-ttl-seconds=${SECKILL_STOCK_TTL_SECONDS:86400}

# Outbox
app.outbox.batch-size=${OUTBOX_BATCH_SIZE:50}
app.outbox.fixed-delay-ms=${OUTBOX_FIXED_DELAY_MS:1000}
app.outbox.max-retry=${OUTBOX_MAX_RETRY:8}
app.outbox.republish-after-seconds=${OUTBOX_REPUBLISH_AFTER_SECONDS:300}

# OpenAPI / Swagger UI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
